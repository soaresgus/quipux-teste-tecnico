spring.application.name=users-api

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/usersdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:users}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:users}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET:changeme-use-a-long-secret-key-at-least-256-bits-for-hmac-sha256}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
